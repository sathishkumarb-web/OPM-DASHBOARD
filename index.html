<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPM Control Center</title>
<style>
:root{color-scheme:dark;--g:#30d158;--a:#ff9f0a;--r:#ff453a;--b:#0a84ff;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1);--mut:#8e9bb4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04070d;overflow:hidden;color:#fff;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;padding:18px 24px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;background:radial-gradient(1100px 500px at 15% -10%,#17294a,#0b1424 60%,#070d18)}
header{display:flex;justify-content:space-between;align-items:center;height:48px;flex:none}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px}.sub{font-size:11px;color:var(--mut);letter-spacing:.6px;margin-top:3px}
.hr{display:flex;gap:8px;align-items:center}
.chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--bd);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.live{font-size:11px;font-weight:700;padding:5px 12px;border-radius:14px;color:#3fe09a;background:#12402f}
.body{display:flex;gap:14px;flex:1;min-height:0}
.left{width:340px;display:flex;flex-direction:column;gap:10px;flex:none}
.right{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:12px 16px}
.lab{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.combo{position:relative}
.combo input{width:100%;background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:12px;color:#fff;padding:12px 32px 12px 14px;font:600 13px inherit;font-family:inherit;outline:none}
.combo input:focus{border-color:var(--b)}.chev{position:absolute;right:12px;top:11px;color:var(--mut);pointer-events:none}
.menu{display:none;position:absolute;z-index:20;top:48px;left:0;right:0;max-height:330px;overflow:auto;background:#1a2742;border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 40px #000a}
.menu.open{display:block}
.it{padding:9px 14px;font-size:12.5px;cursor:pointer;display:flex;gap:8px;align-items:center}
.it:hover{background:rgba(255,255,255,.1)}.it.on{background:rgba(10,132,255,.25);font-weight:700}
.info{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.f small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}.f b{font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border-radius:14px;padding:9px 13px;cursor:pointer;border:1px solid transparent}.stat.on{border-color:#fff}
.stat small{font-size:11px;text-transform:uppercase;opacity:.9}.stat b{display:block;font-size:24px;margin-top:2px}
.s1{background:#1b4b82}.s2{background:#1a6a52}.s3{background:#7a5516}.s4{background:#7a2f3d}
.comp .r{display:flex;justify-content:space-between;align-items:flex-end}.comp b{font-size:28px}.comp span{font-size:11px;color:#bff0d8}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#30d158,#64e3a1)}
.pl{flex:none}.plh{display:flex;justify-content:space-between;align-items:center}
.steps{display:flex;margin-top:6px}
.step{flex:1;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:rgba(255,255,255,.14)}
.step:first-child::before{display:none}.step.done::before{background:var(--g)}.step.active::before{background:linear-gradient(90deg,var(--g),var(--b))}
.cir{width:36px;height:36px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-weight:700;position:relative;z-index:1;background:#223250;border:2px solid rgba(255,255,255,.18);color:var(--mut)}
.step.done .cir{border-color:transparent;color:#04200f;background:var(--g)}
.step.done.Risk .cir{background:var(--a)}.step.done.Fail .cir{background:var(--r);color:#fff}
.step.active .cir{background:var(--b);border-color:#9fd0ff;color:#fff;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #0a84ffaa}100%{box-shadow:0 0 0 12px #0a84ff00}}
.step b{display:block;font-size:12px;margin-top:7px}.step small{display:block;font-size:11px;color:var(--mut)}.step em{display:block;font-style:normal;font-size:10.5px;margin-top:1px}
.kpis{display:flex;gap:12px;flex:none}.kpis .card{flex:1;padding:10px 14px}
.kv{font-size:26px;font-weight:700;line-height:1.15}.ks{font-size:11px;color:var(--mut)}
.tasks{flex:1;min-height:0;background:#fff;color:#222;border-radius:18px;padding:12px 18px;display:flex;flex-direction:column}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.th b{font-weight:600;font-size:15px}
.pill{font-size:11px;font-weight:600;padding:2px 10px;border-radius:12px;white-space:nowrap}
.pc{background:#dff0ff;color:#1b7bd0}.pdone{background:#d9f5e6;color:#0f9a60}.pprog{background:#fde9de;color:#c9622b}.pdel{background:#fde0e0;color:#d03a3a}.pns{background:#e8ebef;color:#667}
.list{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;column-gap:26px;align-content:start}
.task{padding:7px 0;border-top:1px solid #eee}.tt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.meta{font-size:11px;color:#666;margin:4px 0 4px}.tb{height:6px;border-radius:4px;background:#e4e8ec;overflow:hidden}.tb i{display:block;height:100%}
.note{font-size:11px;color:var(--mut);flex:none}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div><h1>OPM CONTROL CENTER</h1><div class="sub">PROJECT MANAGEMENT | BHARAT FIH</div></div>
    <div class="hr" id="port"></div>
  </header>
  <div class="body">
    <div class="left">
      <div class="card">
        <div class="lab">Project Selection</div>
        <div class="combo"><input id="cin" autocomplete="off" placeholder="Select or search a project…"><span class="chev">⌄</span><div class="menu" id="menu"></div></div>
      </div>
      <div class="card"><div class="info" id="info"></div></div>
      <div class="stats">
        <div class="stat s1" data-k=""><small>▤ Total Tasks</small><b id="n1">–</b></div>
        <div class="stat s2" data-k="Completed"><small>✓ Completed</small><b id="n2">–</b></div>
        <div class="stat s3" data-k="In Progress"><small>◔ In Progress</small><b id="n3">–</b></div>
        <div class="stat s4" data-k="Delayed"><small>⚠ Delayed</small><b id="n4">–</b></div>
      </div>
      <div class="card comp"><div class="lab" style="margin-bottom:4px">Project Completion</div>
        <div class="r"><b id="pct">–</b><span>Overall progress</span></div><div class="bar"><i id="pbar" style="width:0"></i></div></div>
      <div class="note" id="note">Connecting…</div>
    </div>
    <div class="right">
      <div class="card pl"><div class="plh"><div class="lab" style="margin:0">Production Line</div><div class="ks" id="plsub"></div></div><div class="steps" id="steps"></div></div>
      <div class="kpis" id="kpis"></div>
      <div class="tasks"><div class="th"><b>TASK MONITORING</b><span class="pill pc" id="cnt">–</span></div><div class="list" id="list"></div></div>
    </div>
  </div>
</div>
<script>
// ===== SETTINGS =====
const API_URL="https://script.google.com/macros/s/AKfycbyxLg782Zp1ECaifVGPdS4oPbBtTySqUIsocbGH4asndgZ9zerAavQLox5RqyX9rTy9/exec"; // Apps Script web app URL (ends with /exec)
const KEY="";                                // same value as SECRET in Code.gs (if you set one)
const EVERY=30000;                           // refresh every 30 s
// ====================
const $=i=>document.getElementById(i);
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const dt=s=>{const m=(s||"").match(/^(\d+)-(\w{3})-(\d+)$/);return m?new Date(2000+ +m[3],MON[m[2]],+m[1]):null};
const dd=(a,b)=>Math.round((b-a)/864e5);
const HC={"On track":"var(--g)",Risk:"var(--a)",Fail:"var(--r)"};
const cls={Completed:["pdone","#12b076"],"In Progress":["pprog","#e8a43c"],Delayed:["pdel","#e05252"],"Not Started":["pns","#9aa7b8"]};
const DEFS=[
["Project Kick-off & requirement confirmation","OPM","KO Date","KO Date"],
["Drawing / BOM review and gap confirmation","RD / NPI","Drawing Complete","Drawing Complete"],
["RM and STD material readiness","Sourcing","Materials ETA"],
["CNC Start","CNC","CNC Start (Plan)","CNC Start (Actual)"],
["CNC End","CNC","CNC End (Plan)","CNC End (Actual)","CNC Start (Actual)"],
["CNC Actual","CNC","CNC End (Plan)","CNC End (Actual)","CNC Start (Actual)"],
["Assembly Start","Assembly","Assembly Start (Plan)","Assembly Start (Actual)"],
["Assembly End","Assembly","Assembly End (Plan)","Assembly End (Actual)","Assembly Start (Actual)"],
["Assembly Actual","Assembly","Assembly End (Plan)","Assembly End (Actual)","Assembly Start (Actual)"],
["QC Check point","Quality","Assembly End (Plan)"],
["FG Packing","Assembly","FG Packing"],
["WareHouse","WH","ETD (Plan)","ETD (Actual)"]
];
function tasksFor(r){
  const disp=r["Dispatched?"]==="Yes",today=new Date();
  return DEFS.map(([n,d,pk,ak,sk])=>{
    const plan=dt(r[pk]),act=ak?dt(r[ak]):null,st=sk?dt(r[sk]):null;
    const done=!!act||disp,p=done?100:(st?50:0);
    let v=0;if(plan){if(act)v=dd(plan,act);else if(!done&&today>plan)v=dd(plan,today)}
    return{n,d,p,v,due:r[pk]||"",s:v>0?"Delayed":done?"Completed":p>0?"In Progress":"Not Started"};
  });
}
const worst=(r,ks)=>{const v=ks.map(k=>r["Health: "+k]);return v.includes("Fail")?"Fail":v.includes("Risk")?"Risk":v.includes("On track")?"On track":""};
function stagesFor(r){
  const disp=r["Dispatched?"]==="Yes",today=new Date(),g=k=>r[k]||"";
  const past=s=>{const d=dt(s);return !!d&&d<=today};
  const S=[
   ["Kick-off",g("KO Date"),!!g("KO Date"),false,worst(r,["KO Meeting"])],
   ["Drawing",g("Drawing Complete"),g("Drawing Status")==="Done"||disp,false,worst(r,["Drawing (PDM)"])],
   ["Materials",g("Materials ETA"),disp||past(g("Materials ETA")),false,worst(r,["Materials ETA"])],
   ["CNC",g("CNC End (Actual)")||g("CNC End (Plan)")||g("CNC Start (Actual)")||g("CNC Start (Plan)"),disp||!!g("CNC End (Actual)"),!!g("CNC Start (Actual)"),worst(r,["CNC Start","CNC End"])],
   ["Assembly",g("Assembly End (Actual)")||g("Assembly End (Plan)")||g("Assembly Start (Actual)")||g("Assembly Start (Plan)"),disp||!!g("Assembly End (Actual)"),!!g("Assembly Start (Actual)"),worst(r,["Assy Start","Assy End"])],
   ["Packing",g("FG Packing"),disp,false,worst(r,["Packing"])],
   ["Dispatch",g("ETD (Actual)")||g("ETD (Plan)"),disp,false,worst(r,["ETD"])]
  ];
  let act=-1;S.forEach((s,i)=>{if(!s[2]&&act<0)act=i});
  return S.map((s,i)=>{const late=!s[2]&&dt(s[1])&&dt(s[1])<today;
    return{n:s[0],date:s[1],done:s[2],active:i===act,h:s[4],
      txt:s[2]?"Complete":i===act?(s[3]?"In progress":"Up next"):"Pending",late}});
}
let D=[],cur="",fs="";
function menuOpen(q){
  const L=D.filter(r=>!q||r.Key.toLowerCase().includes(q));
  $("menu").innerHTML=L.map(r=>`<div class="it${r.Key===cur?" on":""}" data-k="${r.Key}"><span class="dot" style="background:${HC[r["Overall Health"]]||"#566"}"></span>${r.Key}</div>`).join("")||'<div class="it">No matching projects</div>';
  $("menu").classList.add("open");
  const s=$("menu").querySelector(".on");if(s&&!q)s.scrollIntoView({block:"nearest"});
}
const menuClose=()=>{$("menu").classList.remove("open");$("cin").value=cur;$("cin").blur()};
function choose(k){cur=k;menuClose();show()}
function show(){
  const r=D.find(x=>x.Key===cur);if(!r)return;
  const T=tasksFor(r),c=k=>T.filter(t=>t.s===k).length;
  $("cin").value=cur;
  const F=[["Phase",r.Phase],["Site",r.Site],["Type",r.Type],["PO No.",r["PO No."]],["KO Qty",r["KO Qty"]],["KO Date",r["KO Date"]],["Target Date",r["Target Date (FHH NBD)"]],["MFG Status",r["MFG Status"]]];
  $("info").innerHTML=F.map(([a,b])=>`<div class="f"><small>${a}</small><b>${b||"—"}</b></div>`).join("");
  $("n1").textContent=T.length;$("n2").textContent=c("Completed");$("n3").textContent=c("In Progress");$("n4").textContent=c("Delayed");
  const p=Math.round(T.reduce((a,t)=>a+t.p,0)/T.length);$("pct").textContent=p+"%";$("pbar").style.width=p+"%";
  document.querySelectorAll(".stat").forEach(e=>e.classList.toggle("on",fs!==""&&e.dataset.k===fs));
  const S=stagesFor(r);
  $("plsub").textContent=r["Dispatched?"]==="Yes"?"Dispatched":"In production";
  $("steps").innerHTML=S.map((s,i)=>`<div class="step ${s.done?"done":s.active?"active":""} ${s.h}"><div class="cir">${s.done?"✓":i+1}</div><b>${s.n}</b><small>${s.date||"—"}</small><em style="color:${s.late?"var(--r)":s.done?"var(--g)":s.active?"#7cc0ff":"var(--mut)"}">${s.late?"Overdue":s.txt}</em></div>`).join("");
  const v=r["ETD vs Target (days)"],ds=r["Delivery Status"],h=r["Overall Health"],lt=r["Fixture LT (days)"],dtg=r["Days to Target"];
  const vn=parseFloat(v);
  $("kpis").innerHTML=[
   ["Fixture lead time",lt?lt+" d":"—","KO → dispatch","#fff"],
   ["ETD vs target",v===""||isNaN(vn)?"—":(vn>0?"+":"")+vn+" d","Target "+(r["Target Date (FHH NBD)"]||"—"),isNaN(vn)?"#fff":vn>0?"var(--r)":"var(--g)"],
   ["Delivery",ds||"—",dtg!==""&&dtg!=null?dtg+" days to target":"Planned ETD "+(r["ETD (Plan)"]||"—"),/late|overdue/i.test(ds)?"var(--r)":ds?"var(--g)":"#fff"],
   ["Overall health",h||"—","Mfg: "+(r["MFG Status"]||"—"),HC[h]||"#fff"]
  ].map(([a,b,s,col])=>`<div class="card"><div class="lab" style="margin-bottom:3px">${a}</div><div class="kv" style="color:${col};font-size:${b.length>9?18:26}px">${b}</div><div class="ks">${s}</div></div>`).join("");
  const L=T.filter(t=>!fs||t.s===fs);
  $("cnt").textContent=L.length+" Tasks";
  $("list").innerHTML=L.map(t=>{const[k,col]=cls[t.s];
    return `<div class="task"><div class="tt"><span>${t.n}</span><span class="pill ${k}">${t.s}</span></div>
    <div class="meta">${t.d} | ${t.p}% complete${t.due?" | due "+t.due:""}${t.v>0?` | ${t.v} days late`:""}</div>
    <div class="tb"><i style="width:${t.p}%;background:${col}"></i></div></div>`}).join("")||'<div class="meta">No tasks match this filter.</div>';
}
function portfolio(live,msg){
  const n=h=>D.filter(r=>r["Overall Health"]===h).length,disp=D.filter(r=>r["Dispatched?"]==="Yes").length;
  $("port").innerHTML=[["On track","var(--g)"],["Risk","var(--a)"],["Fail","var(--r)"]].map(([h,c])=>`<div class="chip"><span class="dot" style="background:${c}"></span>${h} ${n(h)}</div>`).join("")
   +`<div class="chip">Dispatched ${disp}/${D.length}</div>`
   +(live?`<span class="live">LIVE · ${new Date().toLocaleTimeString()}</span>`:`<span class="live" style="color:#ff8a8a;background:#4a1d24" title="${msg}">OFFLINE</span>`);
}
async function load(){
  try{
    if(!API_URL.startsWith("http"))throw Error("set API_URL in the page settings");
    const res=await fetch(API_URL+(KEY?"?key="+encodeURIComponent(KEY):""));
    const j=await res.json();if(j.error)throw Error(j.error);
    D=j.fixtures.filter(r=>r.Key);
    if(!D.some(r=>r.Key===cur))cur=D.some(r=>r.Key===j.selectedFixture)?j.selectedFixture:(D[0]||{}).Key||"";
    portfolio(true);show();
    $("note").textContent="Refreshes every 30 s. Click a status card to filter tasks.";
  }catch(e){portfolio(false,e.message);$("note").textContent="Could not load data: "+e.message}
}
$("cin").onfocus=()=>{$("cin").select();menuOpen("")};
$("cin").oninput=e=>menuOpen(e.target.value.toLowerCase());
$("cin").onkeydown=e=>{if(e.key==="Escape")menuClose();if(e.key==="Enter"){const f=$("menu").querySelector(".it[data-k]");if(f)choose(f.dataset.k)}};
$("menu").onmousedown=e=>{const it=e.target.closest(".it[data-k]");if(it){e.preventDefault();choose(it.dataset.k)}};
document.addEventListener("mousedown",e=>{if(!e.target.closest(".combo")&&$("menu").classList.contains("open"))menuClose()});
document.querySelectorAll(".stat").forEach(e=>e.onclick=()=>{fs=fs===e.dataset.k?"":e.dataset.k;show()});
// fit the 1280 x 720 canvas to any window
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);
  $("stage").style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`}
addEventListener("resize",fit);fit();
load();setInterval(load,EVERY);
</script>
</body>
</html>
